name: video_net_flutter
description: "Network video scanner & player with Neo-Brutalist design."
publish_to: 'none'

version: 1.0.8

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network scanning
  network_info_plus: ^6.1.3

  # SMB client
  smb_connect: ^0.0.9

  # Video player (media_kit)
  media_kit: ^1.2.1
  media_kit_video: ^1.3.1
  media_kit_libs_android_video: ^1.3.8

  # Typography
  google_fonts: ^6.2.1

  # Permissions
  permission_handler: ^11.4.0

  # State management
  provider: ^6.1.4

  # Credential storage
  shared_preferences: ^2.5.3

  # Path utilities
  path: ^1.9.1
  volume_controller: ^3.4.4
  screen_brightness: ^2.1.7
  package_info_plus: ^9.0.1
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"
